# This is an example configuration file. It should be placed in ~/.config/quantifiedme/config.toml (or equivalent for your operating system)
# For more info, read the README.

[me]
name = "john"

# Hours of next day to count as being part of the previous day (for past midnight shenanigans)
date_offset_hours = 5

[data]
# Category rules: "server" (the default when unset) uses the categories configured
# in aw-server, the same ones the ActivityWatch web UI uses. A path loads an
# aw-research style TOML/CSV file instead. This example config (also the
# fallback when no config file exists) uses the bundled example file, so tests
# against the fakedata server are deterministic.
categories = "./categories.example.toml"
#habitbull = "~/Downloads/HabitBullData.csv"
#location = "~/location"
#oura = "~/Downloads/oura_2020-02-27T09-07-47.json"
#whoop = "~/Downloads/whoop-export"  # CSV/GDPR export dir; the live Whoop API (see load/whoop_api.py) needs no config entry and takes precedence once authorized
#zlantar = "~/Downloads/zlantar-export.zip"  # personal finance export (.zip, .json, or dir)

[data.activitywatch]
port = 5666
# Hosts are discovered from bucket metadata (including buckets synced with aw-sync).
# Optional: only use these hosts, in this priority order (earlier wins on overlap).
hostnames = ["fakedata"]
# Optional: hosts to skip
#exclude_hostnames = ["old-laptop"]
# Optional: include Android devices (default: true, needs aw-client with multidevice support)
#include_mobile = true

#[data.smartertime_buckets]
#example-hostname = '~/data/smartertime/smartertime_export_example-hostname_2020-01-01_bb7f26aa.awbucket.json'

[locations]
    [locations.gym]
    lat = 55.722379
    long = 13.213125
    accuracy = 0.001
